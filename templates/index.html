<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HS编码智能查询系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 HS编码智能查询系统</h1>
            <p>输入商品信息，获取推荐HS编码及监管条件</p>
        </header>

        <form id="searchForm">
            <!-- 货物描述（必填） -->
            <div class="form-group">
                <label for="description">
                    货物描述 <span class="required">*</span>
                    <span class="hint">请尽可能详细描述产品功能、用途、结构特征</span>
                </label>
                <textarea id="description" name="description" rows="4" 
                          placeholder="示例：折叠合成木质儿童写字桌，适用于6-12岁儿童，桌面可调节倾斜角度，带抽屉储物功能，非卧室使用，主要由中密度纤维板(MDF)制成"
                          required></textarea>
                <div class="example-hint">
                    💡 提示：包含材质、用途、是否折叠、使用场景等信息可获得更准确结果
                </div>
            </div>

            <!-- 主要材质（必填） -->
            <div class="form-group">
                <label for="material">
                    主要材质 <span class="required">*</span>
                    <span class="hint">选择或输入主要材质</span>
                </label>
                <div class="material-input-group">
                    <select id="materialSelect">
                        <option value="">选择常见材质...</option>
                        <option value="木质（实木/人造板/MDF/刨花板）">木质（实木/人造板/MDF/刨花板）</option>
                        <option value="塑料（PP/ABS/PE/PVC）">塑料（PP/ABS/PE/PVC）</option>
                        <option value="金属（铁/不锈钢/铝/合金）">金属（铁/不锈钢/铝/合金）</option>
                        <option value="纺织物/布艺">纺织物/布艺</option>
                        <option value="皮革/人造革">皮革/人造革</option>
                        <option value="玻璃/陶瓷">玻璃/陶瓷</option>
                        <option value="石材/大理石">石材/大理石</option>
                        <option value="其他材料">其他材料</option>
                    </select>
                    <input type="text" id="material" name="material" placeholder="或手动输入具体材质，如：中密度纤维板(MDF)" />
                </div>
            </div>

            <!-- 尺寸（选填） -->
            <div class="form-group">
                <label for="dimensions">
                    尺寸 <span class="optional">选填</span>
                    <span class="hint">长、宽、高、厚度等</span>
                </label>
                <input type="text" id="dimensions" name="dimensions" 
                       placeholder="例如：长120cm × 宽60cm × 高75cm，厚度1.8cm" />
            </div>

            <!-- 图片上传（选填） -->
            <div class="form-group">
                <label for="image">
                    产品图片 <span class="optional">选填</span>
                    <span class="hint">上传产品图片辅助识别（支持jpg、png）</span>
                </label>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="image" name="image" accept="image/*" style="display: none;" />
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        📸 点击或拖拽图片到此处上传
                        <span class="upload-hint">支持jpg、png格式，最大5MB</span>
                    </div>
                    <div class="upload-preview" id="uploadPreview" style="display: none;">
                        <img id="previewImg" src="" alt="预览图片" />
                        <button type="button" id="removeImageBtn" class="remove-btn">✕</button>
                    </div>
                </div>
                <div id="uploadStatus" class="upload-status"></div>
            </div>

            <!-- 提交按钮 -->
            <div class="form-actions">
                <button type="submit" id="submitBtn">
                    <span class="btn-text">🔍 查询HS编码</span>
                    <span class="btn-loading" style="display: none;">查询中...</span>
                </button>
                <button type="button" id="resetBtn" class="btn-secondary">重置</button>
            </div>
        </form>

        <!-- 结果区域 -->
        <div id="results" class="results" style="display: none;">
            <h2>📋 查询结果</h2>
            <div id="resultsList"></div>
            <div class="disclaimer">
                <strong>免责声明</strong><br />
                本查询结果仅供参考，最终HS编码归类以海关现场认定为准。建议在正式报关前咨询专业报关人员。
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>正在分析商品信息，智能匹配HS编码...</p>
        </div>

        <!-- 错误提示 -->
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        let uploadedFilename = null;

        // 图片上传区域处理
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('image');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const uploadPreview = document.getElementById('uploadPreview');
        const previewImg = document.getElementById('previewImg');
        const removeImageBtn = document.getElementById('removeImageBtn');
        const uploadStatus = document.getElementById('uploadStatus');

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImageUpload(file);
            } else {
                showUploadStatus('请上传图片文件', 'error');
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleImageUpload(e.target.files[0]);
            }
        });

        removeImageBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetImageUpload();
        });

        function handleImageUpload(file) {
            if (file.size > 5 * 1024 * 1024) {
                showUploadStatus('图片大小不能超过5MB', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            showUploadStatus('上传中...', 'info');
            
            fetch('/api/upload', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    uploadedFilename = data.filename;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        previewImg.src = e.target.result;
                        uploadPlaceholder.style.display = 'none';
                        uploadPreview.style.display = 'flex';
                        showUploadStatus('图片上传成功', 'success');
                    };
                    reader.readAsDataURL(file);
                } else {
                    showUploadStatus('上传失败：' + (data.error || '未知错误'), 'error');
                }
            })
            .catch(err => {
                showUploadStatus('上传失败：网络错误', 'error');
            });
        }

        function resetImageUpload() {
            uploadedFilename = null;
            fileInput.value = '';
            uploadPlaceholder.style.display = 'flex';
            uploadPreview.style.display = 'none';
            previewImg.src = '';
            uploadStatus.style.display = 'none';
        }

        function showUploadStatus(msg, type) {
            uploadStatus.textContent = msg;
            uploadStatus.className = 'upload-status ' + type;
            uploadStatus.style.display = 'block';
            setTimeout(() => {
                if (type !== 'error') {
                    uploadStatus.style.display = 'none';
                }
            }, 3000);
        }

        // 材质选择联动
        const materialSelect = document.getElementById('materialSelect');
        const materialInput = document.getElementById('material');

        materialSelect.addEventListener('change', () => {
            if (materialSelect.value) {
                materialInput.value = materialSelect.value;
            }
        });

        // 表单提交
        const form = document.getElementById('searchForm');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loadingDiv = document.getElementById('loading');
        const resultsDiv = document.getElementById('results');
        const errorDiv = document.getElementById('error');
        const resultsList = document.getElementById('resultsList');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const description = document.getElementById('description').value.trim();
            const material = document.getElementById('material').value.trim();
            const dimensions = document.getElementById('dimensions').value.trim();

            if (!description) {
                showError('请填写货物描述');
                return;
            }
            if (!material) {
                showError('请填写主要材质');
                return;
            }

            // 显示加载状态
            loadingDiv.style.display = 'block';
            resultsDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            submitBtn.disabled = true;

            const requestData = {
                description: description,
                material: material,
                dimensions: dimensions
            };

            if (uploadedFilename) {
                requestData.image = uploadedFilename;
            }

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data.results);
                } else {
                    showError(data.error || '查询失败，请稍后重试');
                }
            } catch (err) {
                showError('网络错误，请检查连接后重试');
            } finally {
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function displayResults(results) {
            if (!results || results.length === 0) {
                resultsList.innerHTML = '<div class="no-results">未找到匹配的HS编码，请尝试更详细的描述</div>';
                resultsDiv.style.display = 'block';
                return;
            }

            let html = '';
            results.forEach((item, index) => {
                const confidence = index === 0 ? '高' : (index === 1 ? '中' : '低');
                const confidenceClass = index === 0 ? 'high' : (index === 1 ? 'medium' : 'low');
                
                html += `
                    <div class="result-card">
                        <div class="result-header">
                            <div class="result-code">
                                <span class="code-label">HS编码</span>
                                <span class="code-value">${escapeHtml(item.hs_code)}</span>
                            </div>
                            <div class="confidence ${confidenceClass}">
                                推荐度：${confidence}
                            </div>
                        </div>
                        <div class="result-name">${escapeHtml(item.name)}</div>
                        <div class="result-description">${escapeHtml(item.description || '暂无详细描述')}</div>
                        <div class="result-section">
                            <div class="section-title">📖 简短说明</div>
                            <div class="result-brief">${escapeHtml(item.brief)}</div>
                        </div>
                        <div class="result-section">
                            <div class="section-title">🛂 监管条件</div>
                            <div class="result-supervision">
                                <span class="supervision-code">${escapeHtml(item.supervision_conditions || '无')}</span>
                                <span class="supervision-desc">${escapeHtml(item.supervision_description || '无特殊监管要求')}</span>
                            </div>
                        </div>
                        <div class="result-details">
                            <div class="detail-item">
                                <span class="detail-label">进口优惠税率</span>
                                <span class="detail-value">${escapeHtml(item.import_tax_rate || '-')}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">增值税率</span>
                                <span class="detail-value">${escapeHtml(item.vat_rate || '-')}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">出口退税率</span>
                                <span class="detail-value">${escapeHtml(item.export_rebate_rate || '-')}</span>
                            </div>
                        </div>
                        ${item.match_reasons && item.match_reasons.length > 0 ? `
                        <div class="result-section">
                            <div class="section-title">✅ 匹配依据</div>
                            <ul class="match-reasons">
                                ${item.match_reasons.map(reason => `<li>${escapeHtml(reason)}</li>`).join('')}
                            </ul>
                        </div>
                        ` : ''}
                    </div>
                `;
            });

            resultsList.innerHTML = html;
            resultsDiv.style.display = 'block';
            window.scrollTo({ top: resultsDiv.offsetTop - 20, behavior: 'smooth' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            resultsDiv.style.display = 'none';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // 重置表单
        resetBtn.addEventListener('click', () => {
            form.reset();
            resetImageUpload();
            resultsDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            materialSelect.value = '';
        });
    </script>
</body>
</html>
