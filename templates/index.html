<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HS编码智能查询系统</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            color: #1e2a3a;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 24px 28px;
            margin-bottom: 30px;
            transition: all 0.2s ease;
        }

        .card h2 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            border-left: 5px solid #2c7da0;
            padding-left: 16px;
            color: #0b3b49;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9rem;
        }

        .form-group label .required {
            color: #e63946;
            margin-left: 4px;
        }

        input, textarea, select {
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: 0.2s;
            font-family: inherit;
            background: #fff;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #2c7da0;
            box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: #2c7da0;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn:hover {
            background: #1f5e7a;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #475569;
        }
        .btn-secondary:hover {
            background: #334155;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #2c7da0;
            color: #2c7da0;
        }
        .btn-outline:hover {
            background: #e6f4f9;
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            background: #fafcff;
            cursor: pointer;
            transition: 0.2s;
        }
        .upload-area:hover {
            border-color: #2c7da0;
            background: #f0f9ff;
        }
        .image-preview {
            margin-top: 15px;
            max-width: 100%;
            display: flex;
            justify-content: center;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 160px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .result-item {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            border-left: 6px solid #2c7da0;
            transition: 0.1s;
        }
        .result-item h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #0f172a;
        }
        .hs-code {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: bold;
            background: #e2e8f0;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            margin-bottom: 12px;
        }
        .tax-info {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 12px 0;
            font-size: 0.9rem;
        }
        .badge {
            background: #e2e8f0;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .match-reason {
            font-size: 0.85rem;
            color: #2d6a4f;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #cbd5e1;
        }
        .loading {
            text-align: center;
            padding: 30px;
            font-style: italic;
            color: #5e6f8d;
        }
        .alert {
            padding: 12px 18px;
            border-radius: 14px;
            margin-bottom: 20px;
        }
        .alert-error {
            background: #ffe6e5;
            border-left: 4px solid #e63946;
            color: #b91c1c;
        }
        .alert-success {
            background: #e0f2e9;
            border-left: 4px solid #2e7d64;
            color: #14532d;
        }
        .alert-warning {
            background: #fff3e0;
            border-left: 4px solid #f59e0b;
            color: #92400e;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        hr {
            margin: 16px 0;
            border: none;
            height: 1px;
            background: #e2e8f0;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: #5e6f8d;
        }
        @media (max-width: 680px) {
            .card {
                padding: 18px;
            }
            .btn {
                width: 100%;
            }
        }
        code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div style="margin-bottom: 20px;">
        <h1 style="color: #0b3b49;">📦 HS编码智能归类系统</h1>
        <p style="color: #334155;">基于商品描述、材质及图片的HS编码推荐 / 支持Excel批量导入最新税则</p>
    </div>

    <!-- 查询卡片 -->
    <div class="card">
        <h2>🔍 查询HS编码</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>货物描述 <span class="required">*</span></label>
                <textarea id="description" placeholder="例如：儿童学习写字桌，可升降，带书架" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>主要材质 <span class="required">*</span></label>
                <input type="text" id="material" placeholder="例如：实木、塑料、金属、人造板" value="木质">
            </div>
            <div class="form-group">
                <label>尺寸（选填）</label>
                <input type="text" id="dimensions" placeholder="例如：120cm x 60cm x 75cm">
            </div>
            <div class="form-group">
                <label>商品照片（辅助识别，选填）</label>
                <div class="upload-area" id="uploadArea">
                    📸 点击或拖拽上传图片 (jpg/png)
                    <input type="file" id="imageInput" accept="image/jpeg,image/png,image/jpg,image/gif" style="display: none;">
                </div>
                <div class="image-preview" id="imagePreview"></div>
                <input type="hidden" id="uploadedImageName" value="">
            </div>
        </div>
        <div class="flex-between">
            <button class="btn" id="searchBtn">✨ 开始查询</button>
            <button class="btn btn-outline" id="clearBtn">清空表单</button>
        </div>
        <div id="queryStatus"></div>
    </div>

    <!-- 查询结果展示 -->
    <div class="card" id="resultCard" style="display: none;">
        <h2>📋 推荐HS编码</h2>
        <div id="resultsContainer" class="results-grid"></div>
    </div>

    <!-- Excel导入卡片 -->
    <div class="card">
        <h2>📂 批量导入HS编码表 (Excel)</h2>
        <p style="margin-bottom: 16px; color: #334155;">支持 .xlsx / .xls / .csv 格式，将自动更新数据库中的HS编码数据。</p>
        <div class="flex-between">
            <label class="btn btn-secondary" style="cursor: pointer; display: inline-block;">
                📎 选择Excel文件
                <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;">
            </label>
            <button class="btn" id="importExcelBtn">⬆️ 上传并导入数据库</button>
        </div>
        <div id="importStatus" style="margin-top: 20px;"></div>
    </div>
    <footer>基于2026年海关税则数据 | 匹配算法持续优化，仅供关务参考</footer>
</div>

<script>
    // DOM 元素
    const descriptionEl = document.getElementById('description');
    const materialEl = document.getElementById('material');
    const dimensionsEl = document.getElementById('dimensions');
    const imageInput = document.getElementById('imageInput');
    const uploadArea = document.getElementById('uploadArea');
    const imagePreview = document.getElementById('imagePreview');
    const uploadedImageName = document.getElementById('uploadedImageName');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resultCard = document.getElementById('resultCard');
    const resultsContainer = document.getElementById('resultsContainer');
    const queryStatus = document.getElementById('queryStatus');
    const excelFileInput = document.getElementById('excelFileInput');
    const importExcelBtn = document.getElementById('importExcelBtn');
    const importStatus = document.getElementById('importStatus');

    let currentImageFile = null;

    // 图片上传区域事件
    uploadArea.addEventListener('click', () => imageInput.click());
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#2c7da0';
    });
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.style.borderColor = '#cbd5e1';
    });
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#cbd5e1';
        const files = e.dataTransfer.files;
        if (files.length > 0 && files[0].type.startsWith('image/')) {
            imageInput.files = files;
            handleImageUpload(files[0]);
        } else {
            showTemporaryMessage(queryStatus, '请拖放图片文件', 'error');
        }
    });

    imageInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleImageUpload(e.target.files[0]);
        }
    });

    async function handleImageUpload(file) {
        if (!file) return;
        const formData = new FormData();
        formData.append('image', file);

        try {
            const response = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                currentImageFile = file;
                uploadedImageName.value = data.filename || '';
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.innerHTML = `<img src="${e.target.result}" alt="预览图">`;
                };
                reader.readAsDataURL(file);
                showTemporaryMessage(queryStatus, '图片上传成功', 'success');
            } else {
                showTemporaryMessage(queryStatus, '图片上传失败: ' + (data.error || '未知错误'), 'error');
                clearImagePreview();
            }
        } catch (err) {
            console.error(err);
            showTemporaryMessage(queryStatus, '图片上传网络错误', 'error');
            clearImagePreview();
        }
    }

    function clearImagePreview() {
        imagePreview.innerHTML = '';
        uploadedImageName.value = '';
        currentImageFile = null;
        imageInput.value = '';
    }

    function showTemporaryMessage(container, text, type = 'info') {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type === 'error' ? 'error' : type === 'warning' ? 'warning' : 'success'}`;
        alertDiv.innerText = text;
        container.appendChild(alertDiv);
        setTimeout(() => {
            if (container.contains(alertDiv)) container.removeChild(alertDiv);
        }, 4000);
    }

    clearBtn.addEventListener('click', () => {
        descriptionEl.value = '';
        materialEl.value = '';
        dimensionsEl.value = '';
        clearImagePreview();
        resultCard.style.display = 'none';
        queryStatus.innerHTML = '';
    });

    // 查询HS编码
    searchBtn.addEventListener('click', async () => {
        const description = descriptionEl.value.trim();
        const material = materialEl.value.trim();
        const dimensions = dimensionsEl.value.trim();

        if (!description) {
            showTemporaryMessage(queryStatus, '请填写货物描述', 'error');
            return;
        }
        if (!material) {
            showTemporaryMessage(queryStatus, '请填写主要材质', 'error');
            return;
        }

        resultCard.style.display = 'block';
        resultsContainer.innerHTML = '<div class="loading">🔎 智能匹配中，请稍候...</div>';

        const requestBody = {
            description: description,
            material: material,
            dimensions: dimensions
        };

        try {
            const response = await fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            if (data.success && data.results && data.results.length > 0) {
                renderResults(data.results);
            } else {
                resultsContainer.innerHTML = '<div class="alert alert-error">未找到匹配的HS编码，请尝试更具体的描述或材质。</div>';
            }
        } catch (err) {
            console.error(err);
            resultsContainer.innerHTML = '<div class="alert alert-error">请求失败，请检查网络或后端服务。</div>';
        }
    });

    function renderResults(results) {
        if (!results.length) {
            resultsContainer.innerHTML = '<div class="alert">暂无推荐结果</div>';
            return;
        }
        let html = '';
        results.forEach((item) => {
            html += `
                <div class="result-item">
                    <div class="flex-between">
                        <h3>${escapeHtml(item.name || '商品')}</h3>
                        <span class="hs-code">${escapeHtml(item.hs_code)}</span>
                    </div>
                    <div class="tax-info">
                        <span class="badge">📈 进口关税: ${item.import_tax_rate || '—'}</span>
                        <span class="badge">🧾 增值税: ${item.vat_rate || '—'}</span>
                        <span class="badge">💰 出口退税: ${item.export_rebate_rate || '—'}</span>
                        <span class="badge">⚙️ 监管条件: ${item.supervision_conditions || '无'}</span>
                    </div>
                    <div>${escapeHtml(item.description || '暂无详细描述')}</div>
                    ${item.supervision_description ? `<div><small>📌 监管说明：${escapeHtml(item.supervision_description)}</small></div>` : ''}
                    ${item.brief ? `<div class="match-reason">📢 ${escapeHtml(item.brief)}</div>` : ''}
                    ${item.match_reasons && item.match_reasons.length ? `<div class="match-reason">🎯 匹配依据：${item.match_reasons.join('；')}</div>` : ''}
                </div>
            `;
        });
        resultsContainer.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // Excel导入逻辑（支持 403 错误处理）
    importExcelBtn.addEventListener('click', async () => {
        const file = excelFileInput.files[0];
        if (!file) {
            showTemporaryMessage(importStatus, '请先选择一个Excel文件', 'error');
            return;
        }
        if (file.size > 5 * 1024 * 1024) {
            showTemporaryMessage(importStatus, '文件大小不能超过5MB', 'error');
            return;
        }
        const allowedExt = /\.(xlsx|xls|csv)$/i;
        if (!allowedExt.test(file.name)) {
            showTemporaryMessage(importStatus, '请上传 .xlsx, .xls 或 .csv 格式文件', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('file', file);

        importStatus.innerHTML = '<div class="loading">⏳ 正在处理并导入数据库，请勿关闭页面...</div>';
        try {
            const resp = await fetch('/api/import_excel', {
                method: 'POST',
                body: formData
            });
            const result = await resp.json();
            if (resp.status === 403 || (result.error && result.error.includes('导入功能已禁用'))) {
                importStatus.innerHTML = `
                    <div class="alert alert-warning">
                        ❌ 导入功能已禁用。<br>
                        如需更新数据，请使用命令行工具：<br>
                        <code>python admin_import.py 文件.xlsx</code>
                    </div>`;
            } else if (result.success) {
                importStatus.innerHTML = `<div class="alert alert-success">✅ ${result.message || '导入成功'}</div>`;
                excelFileInput.value = ''; // 清空选择
            } else {
                importStatus.innerHTML = `<div class="alert alert-error">❌ 导入失败: ${result.error || '未知错误'}</div>`;
            }
        } catch (err) {
            console.error(err);
            importStatus.innerHTML = `<div class="alert alert-error">❌ 网络错误或服务异常</div>`;
        }
    });

    // 点击label触发文件选择
    document.querySelector('label[for="excelFileInput"]')?.addEventListener('click', () => {
        excelFileInput.click();
    });
    excelFileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            showTemporaryMessage(importStatus, `已选择: ${e.target.files[0].name}`, 'success');
        }
    });
</script>
</body>
</html>
